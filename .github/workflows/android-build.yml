name: Build HIT Connect Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17 (required by Capacitor Android / Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies, sync Capacitor & apply official HIT launcher icons
        working-directory: 02_Development
        run: |
          npm install
          npm run prepare-www
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          npm run sync:android-icons
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        working-directory: 02_Development/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload HIT Connect Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HIT-Connect-debug-apk
          path: 02_Development/android/app/build/outputs/apk/debug/app-debug.apk
